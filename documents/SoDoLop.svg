<text x="1616" y="68" class="legendTitle">Chú thích</text>
<text x="1616" y="90" class="legendText">- thuộc tính riêng (private)</text>
<text x="1616" y="112" class="legendText">+ phương thức công khai (public)</text>
<text x="1616" y="134" class="legendText static">Phương thức gạch chân: phương thức lớp</text>
<text x="1616" y="156" class="legendText">(static), dùng để truy vấn dữ liệu.</text>
<text x="1616" y="178" class="legendText"></text>
<text x="1616" y="200" class="legendText">Hình thoi đặc: quan hệ hợp thành, Reply</text>
<text x="1616" y="222" class="legendText">được lưu lồng trong Comment.</text>
<text x="1616" y="244" class="legendText"></text>
<text x="1616" y="266" class="legendText">SubscriptionPlan và AudioPlayer là lớp</text>
<text x="1616" y="288" class="legendText">phía ứng dụng, không lưu trong cơ sở dữ liệu.</text>
<text x="1616" y="310" class="legendText"></text>
<text x="1616" y="332" class="legendText">likedByUserIds của FeedPost, Comment, Reply</text>
<text x="1616" y="354" class="legendText">tham chiếu User (không vẽ đường cho gọn).</text>
<text x="1616" y="376" class="legendText">Song.artist, Album.artist liên kết Artist.name.</text>
